services:

  # ── ocserv VPN ──────────────────────────────────────────────────────────────
  ocserv:
    build: ./ocserv
    container_name: ocserv
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ocserv-config:/etc/ocserv
      - ocserv-run:/run/ocserv
    networks:
      - vpn-net
    restart: unless-stopped
    healthcheck:
      # ocserv creates the socket only once it is fully initialised and ready
      # to accept connections.  Querying `occtl show status` is unreliable at
      # startup (the main worker may not be ready yet); testing the socket
      # file is simpler, faster, and equally authoritative.
      test: ["CMD-SHELL", "test -S /run/ocserv/ocserv.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: vpn-api
    environment:
      DATABASE_URL: "postgresql+asyncpg://vpnuser:${POSTGRES_PASSWORD}@postgres:5432/vpndb"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "${SECRET_KEY}"
      OCSERV_CONFIG_DIR: "/etc/ocserv"
    volumes:
      - ocserv-config:/etc/ocserv
      - ocserv-run:/run/ocserv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vpn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── React frontend ───────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: vpn-frontend
    networks:
      - vpn-net
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vpn-postgres
    environment:
      POSTGRES_USER: vpnuser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: vpndb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vpn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnuser -d vpndb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vpn-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - vpn-net
    restart: unless-stopped

  # ── Nginx reverse-proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vpn-nginx
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - vpn-net
    restart: unless-stopped

volumes:
  ocserv-config:
  ocserv-run:
  postgres-data:
  redis-data:

networks:
  vpn-net:
    driver: bridge
