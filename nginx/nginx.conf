worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── HTTP — redirect to dashboard port ─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health probe (used by docker healthcheck)
        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Redirect everything else to the HTTPS dashboard
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ── HTTPS dashboard ───────────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API proxy
        location /api/ {
            proxy_pass         http://api:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    120s;  # allow time for log/report exports
            proxy_connect_timeout  10s;
            client_max_body_size   10M;  # config file uploads
        }

        # Frontend SPA
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
