# ocserv configuration
# https://ocserv.gitlab.io/www/manual.html

# Authentication — plain passwd + optional OTP
auth = "plain[passwd=/etc/ocserv/ocpasswd,otp=/etc/ocserv/users.oath]"

# TUN device name
device = vpns0

# Listen on all interfaces
tcp-port = 443
udp-port = 443

# TLS certificates (generated at build time or mounted)
server-cert = /etc/ocserv/server.crt
server-key  = /etc/ocserv/server.key

# CA for client certs (optional)
# ca-cert = /etc/ocserv/ca.crt

# Run as root inside container
run-as-user = root
run-as-group = root

socket-file = /run/ocserv/ocserv.sock
pid-file = /run/ocserv/ocserv.pid

# Maximum number of clients
max-clients = 128
max-same-clients = 2

# Keepalive
keepalive = 32400
dpd = 90
mobile-dpd = 1800

# Tunnel mode
tunnel-all-dns = true

# VPN IP pool
ipv4-network = 172.16.0.0/16
ipv4-netmask = 255.255.0.0

# DNS pushed to clients
dns = 8.8.8.8
dns = 1.1.1.1

# Connect/disconnect hooks
connect-script = /etc/ocserv/connect.sh
disconnect-script = /etc/ocserv/disconnect.sh

# Per-user / per-group config directory
config-per-user = /etc/ocserv/user-routes/

# Compression
compression = true
no-compress-limit = 256

# Cookie timeout (seconds)
cookie-timeout = 86400

# Cisco-compatible framing
cisco-client-compat = true

# Route defaults — push nothing; per-user files override
#route = 0.0.0.0/0  # uncomment for full-tunnel default
